[project]
name = "nokware"
version = "0.1.0"
description = "Public AI reliability ledger - eval harness"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "psycopg[binary]>=3.1",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30"]

[project.scripts]
nokware = "nokware.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nokware*"]
